<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#10b981" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MC Skins Hub - سكنات ماين كرافت</title>
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #131a26;
      --surface-2: #1b2536;
      --accent: #10b981;
      --accent-dark: #059669;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --danger: #ef4444;
      --border: rgba(255, 255, 255, 0.08);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 84px;
      line-height: 1.5;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 15, 23, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, #10b981, #047857);
      display: grid;
      place-items: center;
      font-weight: 900;
      color: #fff;
      font-size: 0.9rem;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #052e16; }
    .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-sm { padding: 6px 10px; font-size: 0.78rem; border-radius: 8px; }

    .controls {
      padding: 12px 16px 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-box input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      outline: none;
    }

    .search-box input:focus { border-color: var(--accent); }

    .cats {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }

    .cats::-webkit-scrollbar { display: none; }

    .cat-pill {
      white-space: nowrap;
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .cat-pill.active {
      background: var(--accent);
      color: #052e16;
      border-color: var(--accent);
    }

    .grid {
      padding: 12px 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(4, 1fr); max-width: 1000px; margin: 0 auto; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .preview-box {
      background: radial-gradient(circle at top, #1f2d42, #0f1622);
      border-radius: 10px;
      height: 145px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .preview-box canvas {
      image-rendering: pixelated;
      max-height: 125px;
      max-width: 100%;
    }

    .tag {
      position: absolute;
      top: 7px;
      right: 7px;
      background: rgba(0, 0, 0, 0.55);
      color: #d1fae5;
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 700;
    }

    .title {
      font-weight: 800;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .card-actions .btn { flex: 1; }

    .section-box {
      margin: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      max-width: 800px;
    }

    @media (min-width: 640px) {
      .section-box { margin: 18px auto; }
    }

    .section-box h2, .section-box h3 {
      margin-top: 0;
      font-size: 1rem;
    }

    .field {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.84rem;
      color: var(--muted);
      font-weight: 700;
    }

    .field input, .field select {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(19, 26, 38, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px 4px;
      z-index: 30;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 6px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }

    .nav-btn.active { color: var(--accent); }

    .toast {
      position: fixed;
      bottom: 78px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #065f46;
      color: #ecfdf5;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 50;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hidden { display: none !important; }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 36px 16px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-badge">MC</div>
      <span>MC Skins Hub</span>
    </div>
    <button class="btn btn-primary btn-sm" onclick="generateRandomSkin()">⚡ توليد سكن</button>
  </header>

  <!-- تبويب التصفح -->
  <main id="tab-browse">
    <div class="controls">
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="ابحث عن سكن (محارب، نينجا، فضائي...)" oninput="renderSkins()" />
      </div>
      <div class="cats" id="categoryList"></div>
    </div>
    <div class="grid" id="skinsGrid"></div>
  </main>

  <!-- تبويب المفضلة -->
  <section id="tab-favs" class="hidden">
    <div class="section-box">
      <h2>❤️ السكنات المفضلة</h2>
      <p style="color: var(--muted); font-size: 0.85rem; margin-top: -6px;">محفوظة تلقائياً على جهازك.</p>
    </div>
    <div class="grid" id="favsGrid"></div>
  </section>

  <!-- تبويب رفع سكن للمجتمع -->
  <section id="tab-upload" class="hidden">
    <div class="section-box">
      <h2>📤 أضف سكنك إلى المجتمع</h2>
      <p style="color: var(--muted); font-size: 0.85rem;">
        ارفع ملف سكن بصيغة <strong>PNG</strong> بأبعاد <strong>64×64</strong> أو <strong>128×128</strong> ليظهر مباشرة في قسم المجتمع.
      </p>

      <div class="field">
        <label>اسم السكن</label>
        <input type="text" id="uploadName" placeholder="مثال: ظل الليل" maxlength="32" />
      </div>

      <div class="field">
        <label>التصنيف</label>
        <select id="uploadCat">
          <option value="المجتمع">المجتمع</option>
          <option value="محاربون">محاربون</option>
          <option value="خيال ومستقبل">خيال ومستقبل</option>
          <option value="شخصيات">شخصيات</option>
        </select>
      </div>

      <div class="field">
        <label>ملف السكن (PNG)</label>
        <input type="file" id="uploadFile" accept="image/png" />
      </div>

      <button class="btn btn-primary" style="width: 100%;" onclick="handleUpload()">نشر السكن الآن</button>
    </div>
  </section>

  <!-- تبويب حول والسياسة والأيقونة -->
  <section id="tab-about" class="hidden">
    <div class="section-box">
      <h2>🎨 أيقونة التطبيق الرسمية (512×512)</h2>
      <p style="color: var(--muted); font-size: 0.85rem;">
        حمّل الأيقونة الجاهزة لرفعها مباشرة في Google Play Console.
      </p>
      <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 12px;">
        <canvas id="appIconCanvas" width="96" height="96" style="border-radius: 20px; border: 1px
